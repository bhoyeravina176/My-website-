<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio - Week 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav class="navbar">
<h2>My Portfolio</h2>
<button id="menuBtn" class="menu-btn">☰</button>
<div id="navLinks" class="nav-links">
<a href="#home">Home</a><a href="#about">About</a><a href="#skills">Skills</a><a href="#contact">Contact</a>
<button id="themeBtn" class="theme-btn">🌙 Dark</button>
</div></nav></header>

<main>
<section id="home" class="hero">
<h1>Hello, I'm a Computer Engineering Student</h1>
<p id="welcomeText">Welcome to my interactive portfolio.</p>
<button id="helloBtn">Click Me</button>
</section>
<section id="about" class="section"><h2>About Me</h2>
<p>I am learning web development and building responsive websites using HTML, CSS and JavaScript.</p></section>
<section id="skills" class="section"><h2>My Skills</h2>
<div class="cards"><div class="card">HTML</div><div class="card">CSS</div><div class="card">JavaScript</div></div></section>
<section id="contact" class="section"><h2>Contact Me</h2>
<form id="contactForm">
<input id="name" type="text" placeholder="Your Name">
<input id="email" type="email" placeholder="Your Email">
<textarea id="message" placeholder="Your Message"></textarea>
<button type="submit">Send Message</button><p id="formMsg"></p>
</form></section>
</main>
<footer><p>© 2026 My Portfolio</p></footer>
<script src="script.js"></script>
</body></html>
